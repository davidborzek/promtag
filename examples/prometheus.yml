global:
  scrape_interval: 15s
  evaluation_interval: 15s

# promtag writes one file per container into the shared volume mounted here.
# The glob picks up every rule file it manages.
rule_files:
  - /rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: promtag
    static_configs:
      - targets: ["promtag:9333"]
